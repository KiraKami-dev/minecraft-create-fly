version = '2.0.6+mc1.21.11-port.2'
group = 'dev.ryanhcode.sable'

base { archivesName = 'sable-fabric-1.21.11' }

loom {
    accessWidenerPath = file('src/main/resources/sable.accesswidener')
}

dependencies {
    // api, not implementation: SableMixinPlugin's version constraints load it as soon as a compat mod (e.g. Create) is
    // present, so projects running Sable from source (e2e, simulated) need it on their runtime classpath too
    include(api('org.apache.maven:maven-artifact:3.8.5'))
    include(modApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"))
    // ImGui for the debug inspectors (client only, off until /sableinspector); Modrinth version id of imguimc
    // 2.0.5+mc1.21.11 (fabric). It brings the imgui-java binding, natives and a GL backend, and is bundled as jar-in-jar
    include(modImplementation("maven.modrinth:imguimc:5h3ujBwr"))
    // Loom strips imguimc's own nested jars when remapping it, so the imgui-java binding and natives are nested here
    include(implementation("io.github.spair:imgui-java-binding:${imgui_java_version}"))
    ['linux', 'macos', 'windows'].each { include(runtimeOnly("io.github.spair:imgui-java-natives-${it}:${imgui_java_version}")) }

    // Optional compat targets (compileOnly; mixins are gated by SableMixinPlugin on mod presence)
    modCompileOnly("maven.modrinth:sodium:mc1.21.11-0.8.14-fabric")
    modCompileOnly("maven.modrinth:iris:1.10.8+1.21.11-fabric")
    modCompileOnly("maven.modrinth:shoulder-surfing-reloaded:1.21.11-5.2.0+fabric")
    modCompileOnly("maven.modrinth:jade:21.1.6+fabric")
    // CC: Tweaked 1.117.1 (fabric) by Modrinth version id
    modCompileOnly("maven.modrinth:cc-tweaked:IikPYYtH")
    // Create Fly (Fabric port of Create, bundles flywheel/catnip/ponder); the sable-create mixins are gated on `create`
    modCompileOnly "maven.modrinth:create-fly:${create_fly_version}"
}

processResources {
    def props = [
            mod_id: 'sable', version: project.version, mod_name: 'Sable', mod_author: 'RyanHCode',
            description: 'Interactive moving block structures with physics.',
            license: 'PolyForm Shield License 1.0.0', issues: 'https://github.com/ryanhcode/sable/issues',
            fabric_loader_version: loader_version, minecraft_version: minecraft_version,
            java_version: java_version, fabric_version: fabric_version,
            sodium_version: '0.8.0', sable_companion_version: '1.6.0'
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', '*.mixins.json']) { expand props }
}
